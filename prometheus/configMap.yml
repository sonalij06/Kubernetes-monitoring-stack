apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - "alertmanager-0.alertmanager:9093"
                - "alertmanager-1.alertmanager:9093"
    rule_files:
      - "/etc/prometheus-rules/*.yml"

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['prometheus-0.prometheus:9090','prometheus-1.prometheus:9090']

      - job_name: 'alertmanager'
        static_configs:
          - targets: ['alertmanager-0.alertmanager:9093','alertmanager-1.alertmanager:9093']

      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['monitoring']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            regex: node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
